[project]
name = "benchtheweights"
dynamic = ["version"]
description = "Bench the Weights: a benchmark of AI agents that repair neural networks by editing their weights"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = ["torch==2.5.1", "timm==1.0.11", "transformers==4.46.3", "safetensors==0.4.5", "numpy==2.1.3", "diffusers==0.31.0"]
prepare = ["pyarrow==26.0.1", "pillow==13.0.0", "huggingface_hub==0.36.2"]
dev = ["pytest", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "benchtheweights.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchtheweights = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
